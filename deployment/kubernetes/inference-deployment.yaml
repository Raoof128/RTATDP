# Kubernetes Deployment for Inference Server
# Production-ready with auto-scaling and health checks

apiVersion: apps/v1
kind: Deployment
metadata:
  name: threat-detector-inference
  namespace: security
  labels:
    app: threat-detector
    component: inference
    version: v1.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: threat-detector
      component: inference
  template:
    metadata:
      labels:
        app: threat-detector
        component: inference
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: inference-server
        image: threat-detector:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: threat-detector-config
              key: redis_url
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: threat-detector-config
              key: kafka_bootstrap_servers
        - name: LOG_LEVEL
          value: "info"
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: models
          mountPath: /app/models
          readOnly: true
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: threat-detector-models-pvc
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: threat-detector-inference
  namespace: security
  labels:
    app: threat-detector
    component: inference
spec:
  type: ClusterIP
  selector:
    app: threat-detector
    component: inference
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: threat-detector-inference-hpa
  namespace: security
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: threat-detector-inference
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  - type: Pods
    pods:
      metric:
        name: inference_latency_p95
      target:
        type: AverageValue
        averageValue: "100m"  # 100ms
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: threat-detector-config
  namespace: security
data:
  redis_url: "redis://redis-service:6379/0"
  kafka_bootstrap_servers: "kafka-service:9092"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: threat-detector-models-pvc
  namespace: security
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: fast-ssd

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: threat-detector-ingress
  namespace: security
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - threat-detector.example.com
    secretName: threat-detector-tls
  rules:
  - host: threat-detector.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: threat-detector-inference
            port:
              number: 8000
