apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "threat-detector.fullname" . }}-config
  labels:
    {{- include "threat-detector.labels" . | nindent 4 }}
data:
  # Kafka configuration
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.config.kafka.bootstrapServers | quote }}
  KAFKA_TOPIC_NETWORK: {{ .Values.config.kafka.topics.network | quote }}
  KAFKA_TOPIC_ENDPOINT: {{ .Values.config.kafka.topics.endpoint | quote }}
  KAFKA_TOPIC_APPLICATION: {{ .Values.config.kafka.topics.application | quote }}

  # Redis configuration
  REDIS_HOST: {{ .Values.config.redis.host | quote }}
  REDIS_PORT: {{ .Values.config.redis.port | quote }}
  REDIS_DB: {{ .Values.config.redis.db | quote }}
  REDIS_TTL: {{ .Values.config.redis.ttl | quote }}

  # Model configuration
  MODEL_ENSEMBLE_PATH: {{ .Values.config.models.ensemblePath | quote }}
  MODEL_ANOMALY_PATH: {{ .Values.config.models.anomalyPath | quote }}
  MODEL_THRESHOLD: {{ .Values.config.models.threshold | quote }}

  # API configuration
  API_WORKERS: {{ .Values.config.api.workers | quote }}
  API_TIMEOUT: {{ .Values.config.api.timeout | quote }}
  API_MAX_BATCH_SIZE: {{ .Values.config.api.maxBatchSize | quote }}

  # Environment
  ENVIRONMENT: {{ .Values.global.environment | quote }}
