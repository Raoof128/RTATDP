# Prometheus Configuration for Threat Detection System

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'threat-detection'
    environment: 'production'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Rule files
rule_files:
  - 'alert_rules.yml'

# Scrape configurations
scrape_configs:
  # Inference Server metrics
  - job_name: 'threat-detector-inference'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'inference-server:8000'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: 'inference-server:8000'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'localhost:9090'

  # Redis metrics (using redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets:
          - 'redis-exporter:9121'

  # Kafka metrics (using kafka_exporter)
  - job_name: 'kafka'
    static_configs:
      - targets:
          - 'kafka-exporter:9308'

  # PostgreSQL metrics (using postgres_exporter)
  - job_name: 'postgres'
    static_configs:
      - targets:
          - 'postgres-exporter:9187'

  # Node exporter for system metrics
  - job_name: 'node'
    static_configs:
      - targets:
          - 'node-exporter:9100'
