# Docker Compose for Local Development
# Includes Kafka, Redis, and Inference Server

version: '3.8'

services:
  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: threat-detector-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - threat-detection

  # Kafka broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: threat-detector-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - threat-detection

  # Redis for feature store
  redis:
    image: redis:7-alpine
    container_name: threat-detector-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - threat-detection

  # PostgreSQL for alert storage
  postgres:
    image: postgres:15-alpine
    container_name: threat-detector-postgres
    environment:
      POSTGRES_DB: threat_detection
      POSTGRES_USER: detector
      POSTGRES_PASSWORD: detector_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - threat-detection

  # Inference Server
  inference-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: threat-detector-inference
    depends_on:
      - redis
      - kafka
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9093
      - LOG_LEVEL=info
    volumes:
      - ./models:/app/models
      - ./src:/app/src
    networks:
      - threat-detection
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: threat-detector-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deployment/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - threat-detection

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: threat-detector-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deployment/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./deployment/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - threat-detection

networks:
  threat-detection:
    driver: bridge

volumes:
  kafka-data:
  zookeeper-data:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:
