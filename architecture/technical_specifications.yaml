# Real-Time AI Threat Detection Pipeline - Technical Specifications
# Version: 1.0
# Last Updated: 2025-11-15

metadata:
  project_name: "Real-Time AI Threat Detection Pipeline"
  version: "1.0.0"
  target_deployment: "Production"
  compliance_requirements:
    - "GDPR"
    - "SOC 2"
    - "NIST CSF"

# ============================================================================
# PERFORMANCE SPECIFICATIONS
# ============================================================================

performance:
  throughput:
    target: 500000  # events per second
    measurement: "kafka_consumer_lag"
    sla_percentile: 99
    description: "System must sustain 500K events/second with <1% lag"

  latency:
    end_to_end:
      target_ms: 500
      measurement: "distributed_tracing"
      sla_percentile: 95
      description: "From event ingestion to alert generation"

    inference:
      target_ms: 100
      measurement: "api_response_time"
      sla_percentile: 95
      description: "ML model prediction time"

    feature_extraction:
      target_ms: 50
      measurement: "flink_processing_time"
      sla_percentile: 90
      description: "Feature aggregation and enrichment"

  accuracy:
    true_positive_rate:
      target: 0.95  # 95%
      minimum_acceptable: 0.90
      measurement: "confusion_matrix"
      evaluation_frequency: "weekly"

    false_positive_rate:
      target: 0.02  # 2%
      maximum_acceptable: 0.05
      measurement: "FP / (FP + TN)"
      evaluation_frequency: "daily"

    auc_roc:
      target: 0.97
      minimum_acceptable: 0.93
      measurement: "sklearn.metrics.roc_auc_score"
      evaluation_frequency: "weekly"

    f1_score:
      target: 0.93
      minimum_acceptable: 0.88
      measurement: "2 * (precision * recall) / (precision + recall)"
      evaluation_frequency: "weekly"

  availability:
    uptime_percentage: 99.9  # Three nines
    max_downtime_monthly_minutes: 43.2
    measurement: "prometheus_up_metric"
    alerting_threshold: 99.5

  scalability:
    horizontal_scaling:
      inference_servers:
        min_replicas: 2
        max_replicas: 10
        scale_trigger: "p95_latency > 100ms"
        cooldown_seconds: 300

    kafka_partitions:
      network_events: 20
      endpoint_events: 15
      application_logs: 10
      threat_intel: 5

# ============================================================================
# DATA SPECIFICATIONS
# ============================================================================

data:
  sources:
    network:
      - name: "zeek_dns"
        format: "json"
        protocol: "kafka"
        expected_volume_per_sec: 50000
        latency_requirement_ms: 1000
        schema_version: "1.0"

      - name: "zeek_http"
        format: "json"
        protocol: "kafka"
        expected_volume_per_sec: 30000
        latency_requirement_ms: 1000
        schema_version: "1.0"

      - name: "suricata_alerts"
        format: "eve_json"
        protocol: "kafka"
        expected_volume_per_sec: 5000
        latency_requirement_ms: 500
        schema_version: "1.0"

      - name: "netflow"
        format: "ipfix"
        protocol: "netflow_v9"
        expected_volume_per_sec: 100000
        latency_requirement_ms: 2000
        schema_version: "1.0"

    endpoint:
      - name: "sysmon"
        format: "windows_event_log"
        protocol: "winlogbeat"
        expected_volume_per_sec: 80000
        latency_requirement_ms: 1000
        schema_version: "1.0"

      - name: "osquery"
        format: "json"
        protocol: "kafka"
        expected_volume_per_sec: 20000
        latency_requirement_ms: 2000
        schema_version: "1.0"

    application:
      - name: "web_logs"
        format: "apache_combined"
        protocol: "filebeat"
        expected_volume_per_sec: 150000
        latency_requirement_ms: 5000
        schema_version: "1.0"

      - name: "auth_logs"
        format: "syslog"
        protocol: "rsyslog"
        expected_volume_per_sec: 10000
        latency_requirement_ms: 2000
        schema_version: "1.0"

    threat_intelligence:
      - name: "misp_feed"
        format: "stix2"
        protocol: "rest_api"
        expected_volume_per_hour: 1000
        latency_requirement_ms: 60000
        schema_version: "2.1"

  retention:
    raw_events:
      storage: "kafka"
      duration_days: 7
      compression: "snappy"
      replication_factor: 3

    aggregated_features:
      storage: "redis"
      duration_hours: 1
      ttl_enabled: true

    alerts:
      storage: "postgresql"
      duration_days: 90
      backup_frequency: "hourly"

    ml_models:
      storage: "s3_compatible"
      duration_days: 365
      versioning: true

  quality:
    completeness_threshold: 0.95
    schema_validation: "strict"
    drift_detection_window_hours: 24
    drift_kl_divergence_threshold: 0.1

# ============================================================================
# ML MODEL SPECIFICATIONS
# ============================================================================

ml_models:
  supervised_ensemble:
    models:
      - name: "random_forest"
        library: "scikit-learn"
        version: "1.3.0"
        hyperparameters:
          n_estimators: 200
          max_depth: 20
          min_samples_split: 10
          min_samples_leaf: 5
          max_features: "sqrt"
          class_weight: "balanced"
        ensemble_weight: 0.4

      - name: "xgboost"
        library: "xgboost"
        version: "2.0.0"
        hyperparameters:
          max_depth: 10
          learning_rate: 0.1
          n_estimators: 150
          subsample: 0.8
          colsample_bytree: 0.8
          scale_pos_weight: 10  # For imbalanced classes
        ensemble_weight: 0.35

      - name: "lightgbm"
        library: "lightgbm"
        version: "4.1.0"
        hyperparameters:
          num_leaves: 31
          learning_rate: 0.1
          n_estimators: 100
          subsample: 0.8
          colsample_bytree: 0.8
          is_unbalance: true
        ensemble_weight: 0.25

    ensemble_method: "soft_voting"
    training_frequency: "daily"
    evaluation_metrics:
      - "auc_roc"
      - "precision"
      - "recall"
      - "f1_score"
      - "confusion_matrix"

  unsupervised_anomaly:
    models:
      - name: "isolation_forest"
        library: "scikit-learn"
        version: "1.3.0"
        hyperparameters:
          n_estimators: 100
          contamination: 0.02
          max_samples: 256
          random_state: 42

      - name: "one_class_svm"
        library: "scikit-learn"
        version: "1.3.0"
        hyperparameters:
          kernel: "rbf"
          gamma: "auto"
          nu: 0.02

      - name: "local_outlier_factor"
        library: "scikit-learn"
        version: "1.3.0"
        hyperparameters:
          n_neighbors: 20
          contamination: 0.02
          novelty: true

    ensemble_decision: "majority_vote"  # Flag if ≥2/3 models agree
    training_frequency: "weekly"

  explainability:
    shap_values:
      enabled: true
      top_features: 10
      computation_budget_ms: 50

    lime_explanations:
      enabled: false  # Too computationally expensive for real-time
      use_case: "batch_analysis"

    feature_importance:
      method: "permutation"
      n_iterations: 10

  deployment:
    model_format:
      - "pickle"  # For Python
      - "onnx"    # For cross-platform inference

    model_registry:
      backend: "mlflow"
      tracking_uri: "postgresql://mlflow-db:5432"

    canary_deployment:
      enabled: true
      initial_traffic_percentage: 10
      evaluation_period_hours: 24
      rollback_on_accuracy_drop: 0.05  # 5% drop triggers rollback

# ============================================================================
# FEATURE SPECIFICATIONS
# ============================================================================

features:
  temporal_aggregations:
    windows:
      - "1_minute"
      - "5_minutes"
      - "1_hour"

    metrics:
      - name: "connection_count"
        aggregation: "count"
        group_by: ["source_ip"]

      - name: "unique_dst_ips"
        aggregation: "count_distinct"
        group_by: ["source_ip"]
        field: "destination_ip"

      - name: "unique_dst_ports"
        aggregation: "count_distinct"
        group_by: ["source_ip"]
        field: "destination_port"

      - name: "avg_bytes_sent"
        aggregation: "mean"
        group_by: ["source_ip"]
        field: "bytes_sent"

      - name: "stddev_bytes_sent"
        aggregation: "stddev"
        group_by: ["source_ip"]
        field: "bytes_sent"

      - name: "protocol_distribution"
        aggregation: "value_counts"
        group_by: ["source_ip"]
        field: "protocol"

  statistical:
    - name: "payload_entropy"
      calculation: "shannon_entropy"
      field: "payload"

    - name: "dns_domain_entropy"
      calculation: "shannon_entropy"
      field: "dns_query"

    - name: "http_user_agent_entropy"
      calculation: "shannon_entropy"
      field: "http_user_agent"

    - name: "bytes_sent_percentiles"
      calculation: "percentile"
      percentiles: [50, 90, 99]
      field: "bytes_sent"

  behavioral:
    - name: "is_novel_port"
      logic: "destination_port not in historical_ports (30 days)"
      type: "boolean"

    - name: "is_new_country"
      logic: "geoip_country not in historical_countries (7 days)"
      type: "boolean"

    - name: "off_hours_activity"
      logic: "hour(timestamp) not in [8, 9, ..., 17]"
      type: "boolean"

    - name: "peer_deviation_score"
      calculation: "z_score"
      baseline: "similar_asset_group"
      metric: "connection_count"

  threat_intelligence:
    - name: "ip_reputation_score"
      source: ["virustotal", "abuseipdb"]
      range: [-100, 100]  # -100 malicious, 100 benign
      cache_ttl_hours: 24

    - name: "mitre_techniques"
      source: "sigma_rule_mapping"
      type: "array"

    - name: "ioc_matches"
      source: "misp_feed"
      type: "integer"

  total_features: 47
  feature_vector_size: 47

# ============================================================================
# INFRASTRUCTURE SPECIFICATIONS
# ============================================================================

infrastructure:
  kafka:
    version: "3.6.0"
    cluster_size: 3
    zookeeper_ensemble: 3
    replication_factor: 3
    min_insync_replicas: 2
    retention_hours: 168  # 7 days
    compression_type: "snappy"
    max_message_bytes: 10485760  # 10 MB

  apache_flink:
    version: "1.18.0"
    job_manager_memory: "8g"
    task_manager_count: 5
    task_manager_memory: "32g"
    task_manager_slots: 4
    checkpointing:
      enabled: true
      interval_ms: 60000
      min_pause_ms: 30000
      state_backend: "rocksdb"

  redis:
    version: "7.2"
    deployment_mode: "cluster"
    master_nodes: 3
    replicas_per_master: 1
    max_memory: "64gb"
    eviction_policy: "allkeys-lru"
    persistence:
      enabled: true
      strategy: "rdb"
      save_intervals:
        - "900 1"    # After 900 sec if 1 key changed
        - "300 10"   # After 300 sec if 10 keys changed
        - "60 10000" # After 60 sec if 10000 keys changed

  postgresql:
    version: "15.0"
    instance_type: "r5.xlarge"
    storage_gb: 500
    storage_type: "gp3"
    iops: 10000
    backup_retention_days: 30
    multi_az: true

  kubernetes:
    version: "1.28"
    node_pools:
      - name: "inference"
        instance_type: "c5.2xlarge"
        min_nodes: 2
        max_nodes: 10
        autoscaling: true

      - name: "stream-processing"
        instance_type: "c5.4xlarge"
        min_nodes: 5
        max_nodes: 8
        autoscaling: false

    namespaces:
      - "security"
      - "monitoring"
      - "airflow"

    network_policies:
      enabled: true
      default_deny: true

# ============================================================================
# MONITORING & ALERTING SPECIFICATIONS
# ============================================================================

monitoring:
  prometheus:
    version: "2.48.0"
    retention_days: 15
    scrape_interval: "15s"

    metrics:
      - name: "ai_detector_alerts_total"
        type: "counter"
        labels: ["severity"]

      - name: "inference_latency_seconds"
        type: "histogram"
        buckets: [0.01, 0.05, 0.1, 0.5, 1.0]

      - name: "model_accuracy"
        type: "gauge"

      - name: "kafka_consumer_lag_seconds"
        type: "gauge"
        labels: ["topic", "partition"]

      - name: "feature_store_hit_rate"
        type: "gauge"

  grafana:
    version: "10.2.0"
    dashboards:
      - "threat_detection_overview"
      - "ml_model_performance"
      - "infrastructure_health"
      - "alert_investigation"

  elk_stack:
    elasticsearch:
      version: "8.11.0"
      cluster_nodes: 3
      heap_size: "16g"
      index_retention_days: 30

    logstash:
      version: "8.11.0"
      pipeline_workers: 8

    kibana:
      version: "8.11.0"

  alerting:
    rules:
      - name: "high_alert_volume"
        condition: "rate(ai_detector_alerts_total[1m]) > 1000"
        severity: "warning"
        notification: ["pagerduty", "slack"]

      - name: "model_accuracy_degradation"
        condition: "model_accuracy < 0.90"
        severity: "critical"
        notification: ["pagerduty", "email"]

      - name: "high_inference_latency"
        condition: "histogram_quantile(0.99, inference_latency_seconds) > 0.5"
        severity: "warning"
        notification: ["slack"]

      - name: "kafka_consumer_lag"
        condition: "kafka_consumer_lag_seconds > 300"
        severity: "critical"
        notification: ["pagerduty"]

# ============================================================================
# SECURITY SPECIFICATIONS
# ============================================================================

security:
  authentication:
    api:
      method: "jwt"
      token_expiration_hours: 24
      refresh_token_expiration_days: 7

    kubernetes:
      rbac_enabled: true
      service_accounts: true

  encryption:
    in_transit:
      protocol: "tls_1.3"
      certificate_authority: "lets_encrypt"
      auto_renewal: true

    at_rest:
      database: "aes_256"
      storage: "s3_sse"

  secrets_management:
    backend: "hashicorp_vault"
    rotation_frequency_days: 90
    audit_logging: true

  network:
    ingress_firewall: true
    egress_filtering: true
    allowed_outbound:
      - "threat_intelligence_apis"
      - "package_repositories"

  compliance:
    pii_handling:
      redaction: true
      fields: ["source_ip", "user_agent", "email"]

    audit_logging:
      enabled: true
      retention_days: 365
      immutable: true

    data_deletion:
      gdpr_compliance: true
      deletion_request_sla_days: 30

# ============================================================================
# COST SPECIFICATIONS
# ============================================================================

cost:
  budget:
    monthly_target_usd: 8000
    maximum_acceptable_usd: 10000

  breakdown:
    compute:
      kubernetes_nodes: 4500
      percentage: 56

    storage:
      kafka: 800
      postgresql: 600
      s3: 400
      percentage: 22

    data_transfer:
      inter_az: 300
      internet_egress: 200
      percentage: 6

    managed_services:
      monitoring: 600
      logging: 400
      backup: 200
      percentage: 15

  cost_per_event:
    target: 0.00005  # $0.05 per 1,000 events
    calculation: "total_monthly_cost / (events_per_sec * 2592000)"

  optimization:
    reserved_instances: true
    spot_instances_for_dev: true
    auto_scaling_enabled: true

# ============================================================================
# TESTING SPECIFICATIONS
# ============================================================================

testing:
  unit_tests:
    framework: "pytest"
    coverage_target: 0.85
    required_for_merge: true

  integration_tests:
    framework: "pytest"
    scenarios:
      - "end_to_end_detection_pipeline"
      - "kafka_to_alert_generation"
      - "model_inference_accuracy"

  performance_tests:
    framework: "locust"
    load_scenarios:
      - name: "normal_load"
        events_per_sec: 500000
        duration_minutes: 30

      - name: "spike_load"
        events_per_sec: 750000
        duration_minutes: 5

    acceptance_criteria:
      - "p95_latency < 100ms"
      - "error_rate < 0.01%"

  security_tests:
    sast:
      tool: "bandit"
      severity_threshold: "medium"

    dependency_scanning:
      tool: "safety"
      frequency: "daily"

    penetration_testing:
      frequency: "quarterly"
      scope: "all_external_apis"

# ============================================================================
# CI/CD SPECIFICATIONS
# ============================================================================

cicd:
  platform: "github_actions"

  pipeline_stages:
    - name: "lint"
      tools: ["black", "flake8", "mypy"]

    - name: "test"
      includes: ["unit", "integration"]
      parallel: true

    - name: "build"
      artifacts: ["docker_images", "ml_models"]

    - name: "security_scan"
      tools: ["trivy", "bandit"]

    - name: "deploy_staging"
      environment: "staging"
      approval_required: false

    - name: "deploy_production"
      environment: "production"
      approval_required: true
      approvers: ["security_team", "engineering_lead"]

  deployment_strategy:
    type: "rolling_update"
    max_unavailable: 1
    max_surge: 2

  rollback:
    automated_on_failure: true
    health_check_endpoints: ["/health", "/ready"]
    health_check_timeout_seconds: 300

# ============================================================================
# SLA & SUPPORT SPECIFICATIONS
# ============================================================================

sla:
  availability: 0.999  # 99.9%
  support_hours: "24x7"

  incident_response:
    critical:
      response_time_minutes: 15
      resolution_time_hours: 4

    high:
      response_time_minutes: 60
      resolution_time_hours: 8

    medium:
      response_time_hours: 4
      resolution_time_days: 2

  maintenance_windows:
    frequency: "monthly"
    duration_hours: 2
    notification_days: 7

# ============================================================================
# DOCUMENTATION SPECIFICATIONS
# ============================================================================

documentation:
  required_docs:
    - "architecture/system_design.md"
    - "architecture/technical_specifications.yaml"
    - "docs/deployment_guide.md"
    - "docs/api_reference.md"
    - "docs/model_training_guide.md"
    - "docs/troubleshooting.md"
    - "docs/runbooks/"
    - "README.md"
    - "CONTRIBUTING.md"

  api_documentation:
    format: "openapi_3.0"
    auto_generated: true
    endpoint: "/docs"

  code_comments:
    docstring_coverage: 0.90
    style: "google"

# ============================================================================
# VERSION HISTORY
# ============================================================================

version_history:
  - version: "1.0.0"
    date: "2025-11-15"
    changes:
      - "Initial technical specifications"
    author: "AI Security Engineering Team"
